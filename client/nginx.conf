server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # react-router client-side routing: any unmatched path falls back to index.html
    # so the app's own router handles it instead of nginx returning a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
